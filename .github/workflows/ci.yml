name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests --select E9,F --ignore F401
      - run: pytest -q
      - name: Execute deterministic paired-planner smoke benchmark
        run: |
          python experiments/run_experiments.py --seeds 2 --output results/ci_runs.csv
          python experiments/analyze_results.py --input results/ci_runs.csv --output-dir results/ci
          python - <<'PY'
          import pandas as pd
          runs = pd.read_csv("results/ci_runs.csv")
          assert not runs.empty, "No experimental runs were generated"
          assert {"baseline", "recovernav"}.issubset(set(runs["planner"])), "Missing a planner baseline"
          assert not runs.isnull().all(axis=1).any(), "Experiment produced empty rows"
          print(f"Validated {len(runs)} paired benchmark records")
          PY
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovernav-python-benchmark
          path: |
            results/ci_runs.csv
            results/ci/*.csv
            results/ci/*.png
          if-no-files-found: warn

  ros2-jazzy:
    name: ROS 2 Jazzy / Nav2 planner build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ros:jazzy-ros-base-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS build tools and package dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-rosdep
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install \
            --from-paths ros2_ws/src/recovernav_planner \
            --ignore-src \
            --rosdistro jazzy \
            -r -y

      - name: Build C++ Nav2 global planner
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon --log-base /tmp/recovernav_ros2/log build \
            --base-paths ros2_ws/src/recovernav_planner \
            --build-base /tmp/recovernav_ros2/build \
            --install-base /tmp/recovernav_ros2/install \
            --packages-select recovernav_planner \
            --event-handlers console_direct+

      - name: Run planner unit tests and report failures
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/recovernav_ros2/install/setup.bash
          colcon --log-base /tmp/recovernav_ros2/test-log test \
            --build-base /tmp/recovernav_ros2/build \
            --install-base /tmp/recovernav_ros2/install \
            --packages-select recovernav_planner \
            --event-handlers console_direct+
          colcon test-result \
            --test-result-base /tmp/recovernav_ros2/build \
            --verbose

      - name: Verify plugin installation and discovery
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/recovernav_ros2/install/setup.bash
          ros2 pkg prefix recovernav_planner
          test -f /tmp/recovernav_ros2/install/recovernav_planner/share/recovernav_planner/recovernav_planner_plugin.xml
          test -f /tmp/recovernav_ros2/install/recovernav_planner/lib/librecovernav_planner.so

  movingai-real-maps:
    name: Published MovingAI static pathfinding benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark runner
        run: |
          python -m pip install -e ".[dev]"
      - name: Download published room map and scenario problems
        run: |
          set -euo pipefail
          mkdir -p /tmp/movingai
          curl --fail --location --retry 3 --output /tmp/movingai/map.zip \
            https://movingai.com/benchmarks/room/16room_000.map.zip
          curl --fail --location --retry 3 --output /tmp/movingai/scenarios.zip \
            https://movingai.com/benchmarks/room/16room_000.map-scen.zip
          unzip -q /tmp/movingai/map.zip -d /tmp/movingai/maps
          unzip -q /tmp/movingai/scenarios.zip -d /tmp/movingai/scenarios
          find /tmp/movingai/maps -type f -name '*.map' -print
          find /tmp/movingai/scenarios -type f -name '*.scen' -print
      - name: Run both planners on the published map
        run: |
          set -euo pipefail
          map_file="$(find /tmp/movingai/maps -type f -name '16room_000.map' -print -quit)"
          scene_file="$(find /tmp/movingai/scenarios -type f -name '*.scen' -print -quit)"
          test -n "$map_file"
          test -n "$scene_file"
          python experiments/run_experiments.py \
            --movingai-map "$map_file" \
            --movingai-scen "$scene_file" \
            --start-problem 100 \
            --max-problems 3 \
            --output results/movingai/paired_runs.csv
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          path = Path("results/movingai/paired_runs.csv")
          rows = pd.read_csv(path)
          assert len(rows) == 6
          assert set(rows["planner"]) == {"baseline", "recovernav"}
          assert rows["scenario"].nunique() == 3
          print(rows.to_string(index=False))
          PY
      - name: Retain independent benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovernav-movingai-16room
          path: results/movingai/paired_runs.csv
          if-no-files-found: warn
          retention-days: 14
